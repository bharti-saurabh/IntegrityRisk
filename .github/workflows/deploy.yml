name: Deploy to GitHub Pages

# Builds the demo and publishes it to GitHub Pages.
# In the repository: Settings → Pages → Build and deployment → Source = "GitHub Actions".
#
# The Vite base path defaults to "/integrity-intelligence-command-center/". If the
# repository has a different name, set VITE_BASE below to "/<repo-name>/".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages and cancel in-flight runs.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Type-check and unit-test before shipping. A red build never deploys.
      - run: npm run lint
      - run: npm test

      - name: Build
        run: npm run build
        env:
          # Derive the Pages base from the repo name so forks deploy correctly.
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
